name: Build FreeWarp APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="$(ls *.zip | head -n1)"
          echo "Using $ZIP"
          unzip -q "$ZIP" -d project
          SETTINGS="$(find project -name settings.gradle.kts | head -n1)"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" FreeWarpVPN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreeWarpVPN-apk
          path: FreeWarpVPN.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FreeWarp VPN (build ${{ github.run_number }})
          files: FreeWarpVPN.apk
